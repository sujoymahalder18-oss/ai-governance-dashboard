<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Governance Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: page rail on the left, one report column on the right. Audit-report restraint: one accent, serif figures, status shown as text plus colour. */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#13202B; --muted:#586674; --line:#DCE1E7; --soft:#EDF0F4;
  --accent:#0B4F6C; --accent-ink:#FFFFFF; --accent-fg:#0B4F6C;
  --good:#1D7A4E; --warn:#A8620A; --crit:#B3261E; --neutral:#7A8794;
  --fd:'IBM Plex Serif',Georgia,serif; --fb:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --fm:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E151B; --surface:#16202A; --ink:#E6EBF0; --muted:#9BA8B4; --line:#2A3743; --soft:#1D2934;
    --accent-fg:color-mix(in srgb, var(--accent) 45%, white);
    --good:#4CBF8A; --warn:#E0A24A; --crit:#F0877F; --neutral:#8996A3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#16202A; --ink:#E6EBF0; --muted:#9BA8B4; --line:#2A3743; --soft:#1D2934;
  --accent-fg:color-mix(in srgb, var(--accent) 45%, white);
  --good:#4CBF8A; --warn:#E0A24A; --crit:#F0877F; --neutral:#8996A3; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-fg);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:22px 12px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:flex-start;padding:0 8px}
.mark{width:10px;align-self:stretch;min-height:36px;background:var(--accent);border-radius:2px;flex:none}
.brand b{font-family:var(--fd);font-size:16px;line-height:1.25;display:block}
.brand span{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none;border-left:3px solid transparent}
.nav a:hover{background:var(--soft)}
.nav a[aria-current="page"]{background:var(--soft);border-left-color:var(--accent);font-weight:600}
.railnote{color:var(--muted);font-size:12px;padding:0 8px;margin-top:auto}
.main{padding:26px clamp(16px,3vw,36px) 56px;max-width:1320px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.top h1{font-family:var(--fd);font-size:28px;line-height:1.2;margin-top:2px}
.asat{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:8px;padding:10px 14px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px;min-width:0}
.card>h2{font-size:15px;margin-bottom:12px}
.card .lead{color:var(--muted);margin:-6px 0 12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid2>.card{margin-bottom:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .n{font-family:var(--fd);font-size:34px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12px}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid;white-space:nowrap;line-height:1.6}
.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent);background:color-mix(in srgb,var(--good) 12%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.chip.crit{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 50%,transparent);background:color-mix(in srgb,var(--crit) 12%,transparent)}
.chip.mute{color:var(--muted);border-color:var(--line);background:var(--soft)}
.ragbig{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.ragbig .chip{font-size:18px;padding:4px 18px;font-family:var(--fd)}
.ragbig ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.ragbig p{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none}
.dnum{font-family:var(--fd);font-size:28px;fill:var(--ink)}
.dlab{font-size:10px;fill:var(--muted)}
.hb{display:grid;grid-template-columns:minmax(90px,170px) 1fr 34px;gap:4px 10px;align-items:center;font-size:13px}
.hb .t{background:var(--soft);border-radius:3px;height:12px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--accent)}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.stack{display:flex;height:26px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.stack i{display:block;height:100%}
.heat{border-collapse:separate;border-spacing:3px;width:100%;font-size:13px}
.heat th{font-weight:500;color:var(--muted);text-align:left;padding:4px 6px;font-size:12px}
.heat td.c{text-align:center;border-radius:4px;padding:8px 4px;font-variant-numeric:tabular-nums;min-width:56px}
.heat td.z{color:var(--muted);background:var(--soft)}
.rg td.c{padding:10px 4px}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tbar .sp{flex:1}
.tbar .cnt{color:var(--muted);font-size:12px}
.btn{padding:6px 12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent-fg)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dng{color:var(--crit)}
.btn.sm{padding:3px 9px;font-size:12px}
.tw{overflow-x:auto;max-height:560px;border:1px solid var(--line);border-radius:8px}
.grid{border-collapse:collapse;width:100%;font-size:13px}
.grid th{position:sticky;top:0;background:var(--soft);text-align:left;font-weight:600;padding:8px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;z-index:1}
.grid td{border-bottom:1px solid var(--line);padding:2px 4px;vertical-align:middle}
.grid tr:last-child td{border-bottom:0}
.grid input,.grid select{width:100%;border:1px solid transparent;background:transparent;padding:6px;border-radius:4px;min-width:70px}
.grid input:hover,.grid select:hover{border-color:var(--line)}
.grid input:focus,.grid select:focus{outline:2px solid var(--accent-fg);outline-offset:-1px;background:var(--surface)}
.grid .id{font-family:var(--fm);font-size:12px;color:var(--muted);padding:0 8px;white-space:nowrap}
.grid .empty{padding:22px;text-align:center;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input,.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0}
.gantt{min-width:760px}
.gr{display:grid;grid-template-columns:minmax(170px,270px) 1fr;align-items:center;border-top:1px solid var(--line)}
.gr .lb{padding:5px 10px 5px 4px;font-size:13px;min-width:0}
.gr .lb small{display:block;color:var(--muted);font-size:11px}
.gr.ph{background:var(--soft);font-size:12px;font-weight:600;color:var(--muted);padding:4px 6px}
.gr.ph{display:block}
.gt{position:relative;height:34px}
.gt .bar{position:absolute;top:9px;height:16px;border-radius:3px;min-width:6px}
.gt .m{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.gt .td{position:absolute;top:0;bottom:0;width:2px;background:var(--crit)}
.gr.hd .gt{height:24px}
.gr.hd .gt span{position:absolute;top:4px;font-size:11px;color:var(--muted);padding-left:4px;white-space:nowrap}
.fld{display:grid;grid-template-columns:minmax(160px,230px) minmax(0,1fr);gap:8px 16px;align-items:center;margin-bottom:8px}
.fld label{color:var(--muted);font-size:13px}
.fld textarea{width:100%;font-family:var(--fm);font-size:12px;min-height:110px}
.fld input[type=text],.fld input[type=date],.fld input[type=number],.fld select{width:100%;max-width:420px}
.fld input[type=color]{padding:0;height:34px;width:60px}
.rows{display:flex;flex-direction:column;gap:6px}
.rowline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rowline input[type=text]{flex:1;min-width:140px}
.note{color:var(--muted);font-size:12px;margin:0 0 10px}
.ov{position:fixed;inset:0;background:rgba(10,18,24,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;width:min(720px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.modal textarea{width:100%;min-height:220px;font-family:var(--fm);font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px}
.mact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.foot{color:var(--muted);font-size:12px;margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
.dec{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.dec li{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.dec li:last-child{border-bottom:0;padding-bottom:0}
details summary{cursor:pointer;color:var(--accent-fg);margin-top:8px}
details ul{color:var(--muted);margin:8px 0 0}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;flex-direction:column;gap:8px;border-right:0;border-bottom:1px solid var(--line);padding:12px}
  .nav{flex-direction:row;overflow-x:auto}
  .nav a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}
  .nav a[aria-current="page"]{border-bottom-color:var(--accent)}
  .railnote{display:none}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .fld{grid-template-columns:minmax(0,1fr)}
  .top h1{font-size:23px}
}
@media print{
  .rail,.tbar,.banner,.filters{display:none!important}
  .app{display:block}
  .tw{max-height:none;overflow:visible}
  body{background:#fff}
}
</style>
</head>
<body>

    <div class="railnote" id="railNote">Data stays in this browser. Nothing is uploaded.</div>

    <div id="notices"></div>
    <header class="top" id="top"></header>
    <div id="page"></div>
    <div class="foot">Illustrative template. It is not legal, audit or regulatory advice, and the framework mapping is indicative. Check the published standards before relying on it.</div>
  </main>
</div>

/* ---------- calculations ---------- */
function stats(){
  var cfg=S.cfg,R=cfg.rules,M=cfg.lists.maturity.length;
  var I=S.data.inventory.filter(function(r){return r.name&&String(r.name).trim()});
  var tiers={'High':0,'Medium':0,'Low':0,'To be assessed':0};
  I.forEach(function(r){tiers[tierOf(r)]++});
  var unappHigh=I.filter(function(r){return tierOf(r)==='High'&&inUse(r)&&!isApproved(r)}).length;
  var C=S.data.controls.filter(function(r){return r.name&&String(r.name).trim()});
  var lv=C.map(function(r){var i=cfg.lists.maturity.indexOf(r.level);return i<0?0:i});
  var final=lv.filter(function(i){return i===M-1}).length;
  var evMissing=C.filter(function(r){return M>0&&r.level===cfg.lists.maturity[M-1]&&!(r.evidence&&String(r.evidence).trim())}).length;
  var ready=C.length&&M>1?Math.round(lv.reduce(function(a,b){return a+b/(M-1)},0)/C.length*100):null;
  var openA=S.data.actions.filter(function(a){return a.description&&a.status!==R.doneStatus});
  var late=openA.filter(function(a){return parseD(a.due)&&dayDiff(cfg.asAt,a.due)>0}).map(function(a){return dayDiff(cfg.asAt,a.due)});
  var rmRisk=S.data.roadmap.filter(function(a){return a.activity&&a.status===R.riskStatus}).length;
  var acRisk=openA.filter(function(a){return a.status===R.riskStatus}).length;
  return {I:I,tiers:tiers,unappHigh:unappHigh,C:C,lv:lv,final:final,evMissing:evMissing,ready:ready,openA:openA,late:late,rmRisk:rmRisk,acRisk:acRisk};
}
function ragState(st){
  var R=S.cfg.rules,red=[],amb=[];
  var any=st.I.length||st.C.length||S.data.actions.length||S.data.roadmap.length;
  if(!any)return {level:'No data',cls:'mute',reasons:['Nothing has been entered yet.']};
  if(R.unapprovedHighRed&&st.unappHigh)red.push(st.unappHigh+' high-risk AI system'+(st.unappHigh>1?'s are':' is')+' in use without approval.');
  var lateRed=st.late.filter(function(d){return d>R.overdueRedDays}).length;
  if(lateRed)red.push(lateRed+' action'+(lateRed>1?'s are':' is')+' more than '+R.overdueRedDays+' days overdue.');
  var lateAmb=st.late.length-lateRed;
  if(lateAmb)amb.push(lateAmb+' action'+(lateAmb>1?'s are':' is')+' overdue by '+R.overdueRedDays+' days or less.');
  if(st.rmRisk+st.acRisk)amb.push((st.rmRisk+st.acRisk)+' item'+((st.rmRisk+st.acRisk)>1?'s are':' is')+' marked "'+R.riskStatus+'".');
  if(st.tiers['To be assessed'])amb.push(st.tiers['To be assessed']+' AI system'+(st.tiers['To be assessed']>1?'s need':' needs')+' a data or impact answer before it can be rated.');
  if(st.evMissing)amb.push(st.evMissing+' control'+(st.evMissing>1?'s':'')+' marked "'+S.cfg.lists.maturity[S.cfg.lists.maturity.length-1]+'" '+(st.evMissing>1?'have':'has')+' no evidence reference.');
  if(red.length)return {level:'Red',cls:'crit',reasons:red.concat(amb)};
  if(amb.length)return {level:'Amber',cls:'warn',reasons:amb};
  return {level:'Green',cls:'good',reasons:['No overdue actions, items at risk or unrated systems.']};
}

function csvCell(v){v=String(v==null?'':v);return /[",\n\t\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(rows,C){
  return [C.map(function(c){return csvCell(c.label)}).join(',')].concat(rows.map(function(r){
    return C.map(function(c){return csvCell(c.calc?c.calc(r):r[c.k])}).join(',');
  })).join('\n');
}
function parseTable(text){
  text=String(text).replace(/^﻿/,'');
  var first=text.split(/\r?\n/)[0]||'',d=first.indexOf('\t')>=0?'\t':',';
  var out=[],row=[],cur='',q=false,i,ch;
  for(i=0;i<text.length;i++){ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"'&&cur==='')q=true;
    else if(ch===d){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);out.push(row);row=[];cur=''}
    else cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur);out.push(row)}
  return out.filter(function(r){return r.some(function(x){return String(x).trim()!==''})});

function donut(parts,centre,unit){

  s+='<circle cx="70" cy="70" r="'+R+'" fill="none" style="stroke:var(--soft)" stroke-width="20"/>';
  if(tot>0)parts.forEach(function(p){
    if(!p.value)return;var len=p.value/tot*C;
    s+='<circle cx="70" cy="70" r="'+R+'" fill="none" style="stroke:'+p.color+'" stroke-width="20" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>';off+=len;
  });
  s+='<text x="70" y="70" text-anchor="middle" class="dnum">'+esc(centre)+'</text><text x="70" y="88" text-anchor="middle" class="dlab">'+esc(unit)+'</text></svg>';
  return s;
}

  db.append(confirmBtn('Clear all rows',function(){S.data=emptyData();S.cfg.sample=false;save();render()}));
  db.append(confirmBtn('Reset everything',function(){S=normalise({cfg:baseConfig(),data:emptyData()});save();render()}));
  root.append(card('Data','Export a backup, load the sample, or start again. Clearing rows keeps your settings, lists and frameworks.',db));
};

/* ---------- shell ---------- */
function applyTheme(){
  var a=/^#[0-9a-f]{6}$/i.test(S.cfg.accent)?S.cfg.accent:'#0B4F6C';
  document.documentElement.style.setProperty('--accent',a);
  var n=parseInt(a.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255,lum=(0.299*r+0.587*g+0.114*b)/255;
  document.documentElement.style.setProperty('--accent-ink',lum>0.6?'#13202B':'#FFFFFF');
}
function visiblePages(){return S.cfg.pages.filter(function(p){return p.on||p.id==='setup'})}
var curPage='';
function goPage(id){
  curPage=id;
  try{if(location.hash!=='#'+id)history.replaceState(null,'','#'+id)}catch(e){try{location.hash=id}catch(e2){}}
  render();window.scrollTo(0,0);
}
function currentId(){
  var id=curPage||(location.hash||'').slice(1),v=visiblePages();
  return v.some(function(p){return p.id===id})?id:v[0].id;
}
function drawRail(){
  var cur=currentId();
  $('#railTitle').textContent=S.cfg.title||'AI Governance Dashboard';
  $('#nav').replaceChildren.apply($('#nav'),visiblePages().map(function(p){
    var a=h('a',{href:'#'+p.id,text:p.label});
    a.addEventListener('click',function(ev){ev.preventDefault();goPage(p.id)});
    if(p.id===cur)a.setAttribute('aria-current','page');return a;
  }));
}
function drawTop(){
  var cur=currentId(),p=S.cfg.pages.filter(function(x){return x.id===cur})[0];
  $('#top').replaceChildren(
    h('div',null,h('div',{class:'eyebrow',text:S.cfg.org}),h('h1',{text:p?p.label:''})),
    h('div',{class:'asat',text:'As at '+fmt(S.cfg.asAt)}));
}
function drawNotices(){
  var n=$('#notices'),k=[];
  if(S.cfg.sample)k.push(h('div',{class:'banner'},h('span',null,h('b',{text:'Sample data. '}),'Every entry is invented for illustration. Clear it to start with your own, or edit it in place.'),
    confirmBtn('Clear sample data',function(){S.data=emptyData();S.cfg.sample=false;save();render()},'btn pri')));
  if(!storageOK)k.push(h('div',{class:'banner'},h('span',{text:'This browser is not saving your changes. Use Settings, then Export all, to keep a copy.'})));
  n.replaceChildren.apply(n,k);
}
function render(){
  applyTheme();drawNotices();drawRail();drawTop();
  var id=currentId(),root=$('#page');root.replaceChildren();
  document.title=(S.cfg.title||'AI Governance Dashboard');
  try{PAGES[id](root)}catch(e){root.append(h('div',{class:'card'},h('h2',{text:'This page could not be drawn'}),h('p',{text:String(e&&e.message||e)})))}
}
window.addEventListener('hashchange',function(){curPage=(location.hash||'').slice(1);render();window.scrollTo(0,0)});
render();
})();
</script>
