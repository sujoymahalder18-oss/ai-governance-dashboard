<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Governance Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: page rail on the left, one report column on the right. Audit-report restraint: one accent, serif figures, status shown as text plus colour. */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#13202B; --muted:#586674; --line:#DCE1E7; --soft:#EDF0F4;
  --accent:#0B4F6C; --accent-ink:#FFFFFF; --accent-fg:#0B4F6C;
  --good:#1D7A4E; --warn:#A8620A; --crit:#B3261E; --neutral:#7A8794;
  --fd:'IBM Plex Serif',Georgia,serif; --fb:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --fm:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E151B; --surface:#16202A; --ink:#E6EBF0; --muted:#9BA8B4; --line:#2A3743; --soft:#1D2934;
    --accent-fg:color-mix(in srgb, var(--accent) 45%, white);
    --good:#4CBF8A; --warn:#E0A24A; --crit:#F0877F; --neutral:#8996A3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#16202A; --ink:#E6EBF0; --muted:#9BA8B4; --line:#2A3743; --soft:#1D2934;
  --accent-fg:color-mix(in srgb, var(--accent) 45%, white);
  --good:#4CBF8A; --warn:#E0A24A; --crit:#F0877F; --neutral:#8996A3; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-fg);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:22px 12px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:flex-start;padding:0 8px}
.mark{width:10px;align-self:stretch;min-height:36px;background:var(--accent);border-radius:2px;flex:none}
.brand b{font-family:var(--fd);font-size:16px;line-height:1.25;display:block}
.brand span{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none;border-left:3px solid transparent}
.nav a:hover{background:var(--soft)}
.nav a[aria-current="page"]{background:var(--soft);border-left-color:var(--accent);font-weight:600}
.railnote{color:var(--muted);font-size:12px;padding:0 8px;margin-top:auto}
.main{padding:26px clamp(16px,3vw,36px) 56px;max-width:1320px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.top h1{font-family:var(--fd);font-size:28px;line-height:1.2;margin-top:2px}
.asat{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:8px;padding:10px 14px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px;min-width:0}
.card>h2{font-size:15px;margin-bottom:12px}
.card .lead{color:var(--muted);margin:-6px 0 12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid2>.card{margin-bottom:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .n{font-family:var(--fd);font-size:34px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12px}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid;white-space:nowrap;line-height:1.6}
.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent);background:color-mix(in srgb,var(--good) 12%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.chip.crit{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 50%,transparent);background:color-mix(in srgb,var(--crit) 12%,transparent)}
.chip.mute{color:var(--muted);border-color:var(--line);background:var(--soft)}
.ragbig{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.ragbig .chip{font-size:18px;padding:4px 18px;font-family:var(--fd)}
.ragbig ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.ragbig p{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none}
.dnum{font-family:var(--fd);font-size:28px;fill:var(--ink)}
.dlab{font-size:10px;fill:var(--muted)}
.hb{display:grid;grid-template-columns:minmax(90px,170px) 1fr 34px;gap:4px 10px;align-items:center;font-size:13px}
.hb .t{background:var(--soft);border-radius:3px;height:12px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--accent)}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.stack{display:flex;height:26px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.stack i{display:block;height:100%}
.heat{border-collapse:separate;border-spacing:3px;width:100%;font-size:13px}
.heat th{font-weight:500;color:var(--muted);text-align:left;padding:4px 6px;font-size:12px}
.heat td.c{text-align:center;border-radius:4px;padding:8px 4px;font-variant-numeric:tabular-nums;min-width:56px}
.heat td.z{color:var(--muted);background:var(--soft)}
.rg td.c{padding:10px 4px}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tbar .sp{flex:1}
.tbar .cnt{color:var(--muted);font-size:12px}
.btn{padding:6px 12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent-fg)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dng{color:var(--crit)}
.btn.sm{padding:3px 9px;font-size:12px}
.tw{overflow-x:auto;max-height:560px;border:1px solid var(--line);border-radius:8px}
.grid{border-collapse:collapse;width:100%;font-size:13px}
.grid th{position:sticky;top:0;background:var(--soft);text-align:left;font-weight:600;padding:8px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;z-index:1}
.grid td{border-bottom:1px solid var(--line);padding:2px 4px;vertical-align:middle}
.grid tr:last-child td{border-bottom:0}
.grid input,.grid select{width:100%;border:1px solid transparent;background:transparent;padding:6px;border-radius:4px;min-width:70px}
.grid input:hover,.grid select:hover{border-color:var(--line)}
.grid input:focus,.grid select:focus{outline:2px solid var(--accent-fg);outline-offset:-1px;background:var(--surface)}
.grid .id{font-family:var(--fm);font-size:12px;color:var(--muted);padding:0 8px;white-space:nowrap}
.grid .empty{padding:22px;text-align:center;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input,.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0}
.gantt{min-width:760px}
.gr{display:grid;grid-template-columns:minmax(170px,270px) 1fr;align-items:center;border-top:1px solid var(--line)}
.gr .lb{padding:5px 10px 5px 4px;font-size:13px;min-width:0}
.gr .lb small{display:block;color:var(--muted);font-size:11px}
.gr.ph{background:var(--soft);font-size:12px;font-weight:600;color:var(--muted);padding:4px 6px}
.gr.ph{display:block}
.gt{position:relative;height:34px}
.gt .bar{position:absolute;top:9px;height:16px;border-radius:3px;min-width:6px}
.gt .m{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.gt .td{position:absolute;top:0;bottom:0;width:2px;background:var(--crit)}
.gr.hd .gt{height:24px}
.gr.hd .gt span{position:absolute;top:4px;font-size:11px;color:var(--muted);padding-left:4px;white-space:nowrap}
.fld{display:grid;grid-template-columns:minmax(160px,230px) minmax(0,1fr);gap:8px 16px;align-items:center;margin-bottom:8px}
.fld label{color:var(--muted);font-size:13px}
.fld textarea{width:100%;font-family:var(--fm);font-size:12px;min-height:110px}
.fld input[type=text],.fld input[type=date],.fld input[type=number],.fld select{width:100%;max-width:420px}
.fld input[type=color]{padding:0;height:34px;width:60px}
.rows{display:flex;flex-direction:column;gap:6px}
.rowline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rowline input[type=text]{flex:1;min-width:140px}
.note{color:var(--muted);font-size:12px;margin:0 0 10px}
.ov{position:fixed;inset:0;background:rgba(10,18,24,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;width:min(720px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.modal textarea{width:100%;min-height:220px;font-family:var(--fm);font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px}
.mact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.foot{color:var(--muted);font-size:12px;margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
.dec{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.dec li{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.dec li:last-child{border-bottom:0;padding-bottom:0}
details summary{cursor:pointer;color:var(--accent-fg);margin-top:8px}
details ul{color:var(--muted);margin:8px 0 0}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;flex-direction:column;gap:8px;border-right:0;border-bottom:1px solid var(--line);padding:12px}
  .nav{flex-direction:row;overflow-x:auto}
  .nav a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}
  .nav a[aria-current="page"]{border-bottom-color:var(--accent)}
  .railnote{display:none}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .fld{grid-template-columns:minmax(0,1fr)}
  .top h1{font-size:23px}
}
@media print{
  .rail,.tbar,.banner,.filters{display:none!important}
  .app{display:block}
  .tw{max-height:none;overflow:visible}
  body{background:#fff}
}

.rptbar{display:flex;gap:8px;flex-wrap:wrap}
.rpt{background:#fff;color:#14202B;border:1px solid #DCE1E7;border-radius:8px;padding:30px 34px;max-width:980px;font:13px/1.5 var(--fb)}
.rpt .rh{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--accent);padding-bottom:12px;margin-bottom:16px}
.rpt .rho{text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:#586674}
.rpt h2{font-family:var(--fd);font-size:24px;line-height:1.2;margin:2px 0;color:#14202B}
.rpt .rhs{color:#586674}
.rpt .rhm{font-size:12px;color:#586674;text-align:right}
.rpt .rhm b{color:#14202B;font-weight:600}
.rpt .rc{border-left:4px solid var(--accent);background:#F3F6F9;padding:12px 14px;margin:0 0 14px;font-size:14px}
.rpt .rk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 14px}
.rpt .rk .t{border:1px solid #DCE1E7;padding:8px 10px;border-radius:6px}
.rpt .rk .n{font-family:var(--fd);font-size:26px;line-height:1.2}
.rpt .rk .l{font-size:11px;color:#586674}
.rpt h3.rs{font-size:14px;margin:18px 0 6px;border-bottom:1px solid #DCE1E7;padding-bottom:3px;color:#14202B}
.rpt h4{font-size:11px;margin:10px 0 4px;color:#586674;text-transform:uppercase;letter-spacing:.05em}
.rpt table.rt{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0 8px}
.rpt .rt th{background:#EDF0F4;text-align:left;padding:5px 7px;border-bottom:1px solid #C9D0D8;font-weight:600;color:#14202B}
.rpt .rt td{padding:5px 7px;border-bottom:1px solid #E6EAEE;vertical-align:top}
.rpt .rt td.none,.rpt p.none{color:#586674;font-style:italic}
.rpt .mono{font-family:var(--fm);font-size:10px;overflow-wrap:anywhere}
.rpt .rg{display:inline-block;padding:0 8px;border-radius:3px;font-weight:600;font-size:11px;color:#fff;line-height:1.7;white-space:nowrap}
.rpt .rg.good{background:#1D7A4E}.rpt .rg.warn{background:#A8620A}.rpt .rg.crit{background:#B3261E}.rpt .rg.mute{background:#7A8794}
.rpt .rb{font-size:11px;color:#586674;margin-top:14px;border-top:1px solid #DCE1E7;padding-top:8px}
.rpt .rf{font-size:10px;color:#586674;margin-top:10px;border-top:1px solid #DCE1E7;padding-top:6px;display:grid;gap:2px}
.rpt .pc{border:1px solid #DCE1E7;border-radius:6px;padding:8px 10px;margin:8px 0}
.rpt .pcs{font-size:11px;color:#586674;margin:2px 0 4px}
@media print{
  body.rptmode .top,body.rptmode .foot,body.rptmode #notices,.noprint{display:none!important}
  body.rptmode .main{padding:0;max-width:none}
  body.rptmode .rpt{border:0;padding:0;max-width:none}
  .rpt tr,.rpt .pc{break-inside:avoid}.rpt thead{display:table-header-group}
  .rpt h3.rs,.rpt h4{break-after:avoid}
  @page{margin:14mm}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><div class="mark" aria-hidden="true"></div><div><b id="railTitle">AI Governance Dashboard</b><span>Template</span></div></div>
    <nav class="nav" id="nav" aria-label="Pages"></nav>
    <div class="railnote" id="railNote">Data stays in this browser. Nothing is uploaded.</div>
  </aside>
  <main class="main" id="main">
    <div id="notices"></div>
    <header class="top" id="top"></header>
    <div id="page"></div>
    <div class="foot">Illustrative template. It is not legal, audit or regulatory advice, and the framework mapping is indicative. Check the published standards before relying on it.</div>
  </main>
</div>

function sha256(str){return sha256b(new TextEncoder().encode(str))}
function sha256b(m){

function hashEntry(prev,e){return sha256(prev+'|'+JSON.stringify([e.t,e.who,e.table,e.id,e.field,e.from,e.to]))}
function normalise(x){

  if(!Array.isArray(cfg.pages)||!cfg.pages.length)cfg.pages=b.pages;
  if(!cfg.pages.some(function(p){return p.id==='setup'}))cfg.pages.push({id:'setup',label:'Settings',on:true});
  var pi;
  if(!cfg.pages.some(function(p){return p.id==='evidence'})){pi=cfg.pages.map(function(p){return p.id}).indexOf('controls');cfg.pages.splice(pi<0?cfg.pages.length:pi+1,0,{id:'evidence',label:'Evidence',on:true})}

  var data=Object.assign(emptyData(),x.data||{});
  for(k in data)if(!Array.isArray(data[k]))data[k]=[];
  if(!cfg.pages.some(function(p){return p.id==='history'})){var si=cfg.pages.map(function(p){return p.id}).indexOf('setup');cfg.pages.splice(si<0?cfg.pages.length:si,0,{id:'history',label:'Change history',on:true})}

  var base=typeof x.logBase==='string'&&/^[0-9a-f]{64}$/.test(x.logBase)?x.logBase:GENESIS;
  if(log.length&&!log.some(function(e){return e.h})){var pv=base;log.forEach(function(e){e.p=pv;e.h=hashEntry(pv,e);pv=e.h})}
  var seals=Array.isArray(x.seals)?x.seals.filter(function(q){return q&&/^[0-9a-f]{64}$/.test(q.h)}):[];

function tierOf(r){
  if(!r.name||!String(r.name).trim())return '';
  var dc=S.cfg.lists.dataCats.filter(function(x){return x.name===r.dataCat})[0];
  var high=(r.affects==='Yes'&&S.cfg.rules.affectsPeopleHigh)||(dc&&dc.tier==='High');
  if(high)return 'High';
  if(!dc||!r.affects||r.affects==='Not known')return 'To be assessed';
  return dc.tier;
}
function inUse(r){return r.status===S.cfg.rules.inUseStatus}
function isApproved(r){return S.cfg.lists.approvedDecisions.indexOf(r.approved)>=0}
function headHash(){return (S.log.length&&S.log[S.log.length-1].h)||S.logBase}
function logChange(table,id,field,from,to){
  var e={t:new Date().toISOString(),who:S.cfg.user||'',table:table,id:id||'',field:field||'',from:from==null?'':String(from),to:to==null?'':String(to)};
  e.p=headHash();e.h=hashEntry(e.p,e);S.log.push(e);
  if(S.log.length>1000){var d=S.log.splice(0,S.log.length-1000);S.logBase=d[d.length-1].h}
}
function verifyChain(){
  var prev=S.logBase,bad=null,i,e;
  for(i=0;i<S.log.length;i++){
    e=S.log[i];
    if(typeof e.h!=='string'||typeof e.p!=='string'){bad={i:i,why:'has no fingerprint'};break}
    if(e.p!==prev){bad={i:i,why:'does not follow the entry before it (an entry may have been removed, added or moved)'};break}
    if(hashEntry(prev,e)!==e.h){bad={i:i,why:'was changed after it was recorded'};break}
    prev=e.h;
  }
  var lost=S.seals.filter(function(q){return q.h!==S.logBase&&!S.log.some(function(x){return x.h===q.h})});
  return {ok:!bad,bad:bad,head:prev,n:S.log.length,lost:lost};
}

var PREFIX={inventory:'AI-',controls:'CT-',roadmap:'RM-',actions:'AC-',risks:'RK-',evidence:'EV-',audits:'AU-'};
function nextId(t){

  return PREFIX[t]+String(m+1).padStart(3,'0');
}
function newRow(t){

/* ---------- calculations ---------- */
function stats(){
  var cfg=S.cfg,R=cfg.rules,M=cfg.lists.maturity.length;
  var I=S.data.inventory.filter(function(r){return r.name&&String(r.name).trim()});
  var tiers={'High':0,'Medium':0,'Low':0,'To be assessed':0};
  I.forEach(function(r){tiers[tierOf(r)]++});
  var unappHigh=I.filter(function(r){return tierOf(r)==='High'&&inUse(r)&&!isApproved(r)}).length;
  var C=S.data.controls.filter(function(r){return r.name&&String(r.name).trim()});
  var lv=C.map(function(r){var i=cfg.lists.maturity.indexOf(r.level);return i<0?0:i});
  var final=lv.filter(function(i){return i===M-1}).length;
  var evMissing=C.filter(function(r){return M>0&&r.level===cfg.lists.maturity[M-1]&&!(r.evidence&&String(r.evidence).trim())}).length;
  var ready=C.length&&M>1?Math.round(lv.reduce(function(a,b){return a+b/(M-1)},0)/C.length*100):null;
  var openA=S.data.actions.filter(function(a){return a.description&&a.status!==R.doneStatus});
  var late=openA.filter(function(a){return parseD(a.due)&&dayDiff(cfg.asAt,a.due)>0}).map(function(a){return dayDiff(cfg.asAt,a.due)});
  var rmRisk=S.data.roadmap.filter(function(a){return a.activity&&a.status===R.riskStatus}).length;
  var acRisk=openA.filter(function(a){return a.status===R.riskStatus}).length;
  return {I:I,tiers:tiers,unappHigh:unappHigh,C:C,lv:lv,final:final,evMissing:evMissing,ready:ready,openA:openA,late:late,rmRisk:rmRisk,acRisk:acRisk};
}
function ragState(st){
  var R=S.cfg.rules,red=[],amb=[];
  var any=st.I.length||st.C.length||S.data.actions.length||S.data.roadmap.length;
  if(!any)return {level:'No data',cls:'mute',reasons:['Nothing has been entered yet.']};
  if(R.unapprovedHighRed&&st.unappHigh)red.push(st.unappHigh+' high-risk AI system'+(st.unappHigh>1?'s are':' is')+' in use without approval.');
  var lateRed=st.late.filter(function(d){return d>R.overdueRedDays}).length;
  if(lateRed)red.push(lateRed+' action'+(lateRed>1?'s are':' is')+' more than '+R.overdueRedDays+' days overdue.');
  var lateAmb=st.late.length-lateRed;
  if(lateAmb)amb.push(lateAmb+' action'+(lateAmb>1?'s are':' is')+' overdue by '+R.overdueRedDays+' days or less.');
  if(st.rmRisk+st.acRisk)amb.push((st.rmRisk+st.acRisk)+' item'+((st.rmRisk+st.acRisk)>1?'s are':' is')+' marked "'+R.riskStatus+'".');
  if(st.tiers['To be assessed'])amb.push(st.tiers['To be assessed']+' AI system'+(st.tiers['To be assessed']>1?'s need':' needs')+' a data or impact answer before it can be rated.');
  if(st.evMissing)amb.push(st.evMissing+' control'+(st.evMissing>1?'s':'')+' marked "'+S.cfg.lists.maturity[S.cfg.lists.maturity.length-1]+'" '+(st.evMissing>1?'have':'has')+' no evidence reference.');
  if(red.length)return {level:'Red',cls:'crit',reasons:red.concat(amb)};
  if(amb.length)return {level:'Amber',cls:'warn',reasons:amb};
  return {level:'Green',cls:'good',reasons:['No overdue actions, items at risk or unrated systems.']};
}

/* ---------- evidence ---------- */
var EV_KINDS=['Design','Operating'];
function named(r){return r.name&&String(r.name).trim()}
function pl(n,w){return n+' '+w+(n===1?'':'s')}
function hexOf(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2)}).join('')}
function hashFile(file,ok,fail){
  var MAXF=100*1048576,SLOW=20*1048576;
  if(file.size>MAXF){fail('This file is larger than 100 MB. Use a smaller file, or work out the fingerprint elsewhere and type it in.');return}
  var rd=new FileReader();
  function slow(buf){if(buf.byteLength>SLOW){fail('This browser cannot fingerprint a file larger than 20 MB here. Use a smaller file, or work out the fingerprint elsewhere and type it in.');return}ok(sha256b(new Uint8Array(buf)))}
  rd.onerror=function(){fail('The file could not be read.')};
  rd.onload=function(){
    var buf=rd.result;
    if(window.crypto&&crypto.subtle&&crypto.subtle.digest){crypto.subtle.digest('SHA-256',buf).then(function(d){ok(hexOf(d))},function(){slow(buf)})}
    else slow(buf);
  };
  rd.readAsArrayBuffer(file);
}
function evItems(){return S.data.evidence.filter(function(e){return (e.title&&String(e.title).trim())||e.link||e.fingerprint})}
function evCurrent(e){var v=e.validUntil;return !v||!parseD(v)||dayDiff(v,S.cfg.asAt)>=0}
function evSoon(e){var v=e.validUntil;if(!v||!parseD(v))return false;var d=dayDiff(v,S.cfg.asAt);return d>=0&&d<=S.cfg.rules.evSoonDays}
function ctlKeys(c){return [String(c.lib||'').toUpperCase(),String(c.id||'').toUpperCase()].filter(Boolean)}
function evFor(c){var k=ctlKeys(c);return evItems().filter(function(e){return splitRefs(e.controls).some(function(x){return k.indexOf(x)>=0})})}
function specOf(c){var l=LIB.filter(function(x){return x.code===c.lib})[0];return l?{d:l.ed,o:l.eo,r:l.er,sys:!!l.sys}:null}
function isNA(c){return c.applies==='Not applicable'}
function claimed(c){var M=S.cfg.lists.maturity,i=M.indexOf(c.level);return M.length>=3&&i>=M.length-2}
function evAssess(c){
  var items=evFor(c),cur=items.filter(evCurrent),sp=specOf(c),opOf=function(e){return e.kind==='Operating'};
  var a={n:items.length,cur:cur.length,design:cur.some(function(e){return e.kind==='Design'}),op:false,cov:null,gap:''};
  if(sp&&sp.sys){
    var sy=S.data.inventory.filter(function(r){return named(r)&&inUse(r)});
    if(sy.length){
      var ok=sy.filter(function(s){var id=String(s.id).toUpperCase();return cur.some(function(e){return opOf(e)&&splitRefs(e.systems).indexOf(id)>=0})}).length;
      a.cov={ok:ok,of:sy.length};a.op=ok===sy.length;
    }else a.op=cur.some(opOf);
  }else a.op=cur.some(opOf);
  a.status=!a.n?'None':!a.cur?'Expired':(a.design&&a.op?'Complete':'Partial');
  if(a.status==='None')a.gap='No evidence recorded';
  else if(a.status==='Expired')a.gap='All evidence has expired';
  else if(a.status==='Partial'){
    var g=[];if(!a.design)g.push('design evidence');
    if(!a.op)g.push(a.cov?'operating evidence for '+(a.cov.of-a.cov.ok)+' of '+a.cov.of+' in-use systems':'operating evidence');
    a.gap='Missing: '+g.join('; ');
  }
  return a;
}
function evSummary(){

function csvCell(v){v=String(v==null?'':v);return /[",\n\t\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(rows,C){
  return [C.map(function(c){return csvCell(c.label)}).join(',')].concat(rows.map(function(r){
    return C.map(function(c){return csvCell(c.calc?c.calc(r):r[c.k])}).join(',');
  })).join('\n');
}
function parseTable(text){
  text=String(text).replace(/^﻿/,'');
  var first=text.split(/\r?\n/)[0]||'',d=first.indexOf('\t')>=0?'\t':',';
  var out=[],row=[],cur='',q=false,i,ch;
  for(i=0;i<text.length;i++){ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"'&&cur==='')q=true;
    else if(ch===d){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);out.push(row);row=[];cur=''}
    else cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur);out.push(row)}
  return out.filter(function(r){return r.some(function(x){return String(x).trim()!==''})});
}
function normDate(v){
  v=String(v||'').trim();if(!v)return {v:''};
  if(parseD(v))return {v:v};
  var m=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/.exec(v);
  if(m){var d=new Date(+m[3],+m[2]-1,+m[1]);if(d.getMonth()===+m[2]-1)return {v:iso(d)}}
  var t=Date.parse(v+' 12:00');if(!isNaN(t))return {v:iso(new Date(t))};
  return {v:'',bad:1};
}

    n.append(h('h4',{text:a.name}),rTable(['Area','Controls','Complete','Partial','None or expired','Rating'],a.rows.filter(function(g){return g.id!==''}).map(function(g){return [g.label,g.app,g.Complete,g.Partial,g.Gap,g.app?rRag(g.rate.l+' '+g.pct+'%',g.rate.cls):'Not applicable']}),{empty:'No controls recorded yet.'}));
  });
  n.append(h('p',{class:'pcs',text:'Controls with no mapping to a framework group are not shown in that framework table.'}),rSec(2,'Main gaps'),rTable(['Code','Control','Owner','Maturity','Position'],evGaps(ev).slice(0,5).map(function(x){return [x.c.lib||x.c.id,x.c.name,x.c.owner||'–',x.c.level||'–',x.a.status+(x.flag?' (claimed without evidence)':'')+'. '+x.a.gap]}),{empty:'No gaps.'}),
    rSec(3,'Decisions sought'),rTable(['Ref','Decision','Owner','Due'],dec,{empty:'No decisions are sought.'}),rBasis());
  return rFinish(n,null);
}
function repMD(){
  var ev=evSummary(),items=evItems(),late=rActsLate(),R=S.cfg.rules,M=S.cfg.lists.maturity;
  var none=ev.rows.filter(function(x){return x.a.status==='None'||x.a.status==='Expired'}),part=ev.rows.filter(function(x){return x.a.status==='Partial'});
  var due=items.filter(function(e){return !evCurrent(e)||evSoon(e)}).sort(function(a,b){return String(a.validUntil).localeCompare(String(b.validUntil))});
  var risks=S.data.risks.filter(function(r){return r.risk&&r.status==='Open'}).sort(function(a,b){return (scoreOf(b)||0)-(scoreOf(a)||0)});
  var sentence=pl(none.length,'control')+(none.length===1?' has':' have')+' no current evidence'+(ev.flagged?', of which '+ev.flagged+(ev.flagged===1?' is':' are')+' marked "'+M[M.length-2]+'" or above':'')+'. '+pl(part.length,'control')+(part.length===1?' is':' are')+' partly evidenced. '+pl(due.length,'evidence item')+(due.length===1?' has':' have')+' expired or '+(due.length===1?'expires':'expire')+' within '+R.evSoonDays+' days. '+pl(late.length,'action')+(late.length===1?' is':' are')+' overdue.';
  var csvRows=none.concat(part).map(function(x){return {code:x.c.lib||x.c.id,control:x.c.name,owner:x.c.owner||'',maturity:x.c.level||'',status:x.a.status,flagged:x.flag?'Yes':'',position:x.a.gap}});
  var n=h('div',null,rHead('AI governance: evidence gap report','Management report'),
    h('div',{class:'rc'},h('b',{text:'Conclusion. '}),sentence),
    rSec(1,'Controls with no current evidence'),rTable(['Code','Control','Owner','Maturity','Status','Claimed'],none.map(function(x){return [x.c.lib||x.c.id,x.c.name,x.c.owner||'–',x.c.level||'–',x.a.status,x.flag?'Yes':'']}),{empty:'None.'}),
    rSec(2,'Controls with partial evidence'),rTable(['Code','Control','Owner','Missing'],part.map(function(x){return [x.c.lib||x.c.id,x.c.name,x.c.owner||'–',x.a.gap.replace('Missing: ','')]}),{empty:'None.'}),
    rSec(3,'Evidence expired or expiring within '+R.evSoonDays+' days'),rTable(['ID','Item','Supports','Valid until','Owner','Status'],due.map(function(e){return [e.id,e.title||'–',e.controls||'–',fmt(e.validUntil),e.owner||'–',evItemStatus(e)]}),{empty:'None.'}),
    rSec(4,'Overdue actions'),rTable(['ID','Action','Owner','Due','Days overdue'],late.map(function(a){return [a.id,a.description,a.owner||'–',fmt(a.due),dayDiff(S.cfg.asAt,a.due)]}),{empty:'None.'}),
    rSec(5,'Risks with no treatment started (status Open)'),rTable(['ID','Risk','Rating','Owner'],risks.map(function(r){return [r.id,r.risk,bandOf(scoreOf(r))||'–',r.owner||'–']}),{empty:'None.'}),rBasis());
  return rFinish(n,{rows:csvRows,cols:[['code','Code'],['control','Control'],['owner','Owner'],['maturity','Maturity'],['status','Evidence status'],['flagged','Claimed without evidence'],['position','Position']]});
}
function repRegister(){
  var ev=evSummary(),rows=ev.rows.map(function(x){
    return {id:x.c.id,code:x.c.lib||'',control:x.c.name,domain:x.c.domain||'',owner:x.c.owner||'',maturity:x.c.level||'',status:x.a.status+(x.flag?' (claimed without evidence)':''),latest:evLatest(x.c),iso:x.c.isoRefs||'',nist:x.c.nistRefs||'',reason:isNA(x.c)?(x.c.naReason||''):''};
  });
  var sentence=ev.total?ev.Complete+' of '+ev.app+' applicable controls have complete, current evidence; '+ev.Partial+' partial; '+(ev.None+ev.Expired)+' none or expired; '+ev.na+' not applicable.':'No controls are recorded.';
  var n=h('div',null,rHead('AI governance: control status register','Register of controls'),
    h('div',{class:'rc'},h('b',{text:'Conclusion. '}),sentence),
    rSec(1,'Controls'),rTable(['ID','Code','Control','Domain','Owner','Maturity','Evidence status','Latest evidence','ISO/IEC 42001','NIST AI RMF'],rows.map(function(r){return [r.id,r.code,r.control,r.domain,r.owner||'–',r.maturity||'–',r.status+(r.reason?'. '+r.reason:''),r.latest?fmt(r.latest):'–',r.iso||'–',r.nist||'–']}),{empty:'No controls recorded yet.'}),rBasis());
  return rFinish(n,{rows:rows,cols:[['id','ID'],['code','Code'],['control','Control'],['domain','Domain'],['owner','Owner'],['maturity','Maturity'],['status','Evidence status'],['latest','Latest evidence date'],['iso','ISO/IEC 42001 references'],['nist','NIST AI RMF references'],['reason','Not applicable reason']]});
}
function repPack(scope){
  var ev=evSummary(),rows=ev.rows,audits=S.data.audits.filter(function(a){return a.audit||a.items}),label='All controls';
  if(scope.indexOf('dom:')===0){var d=scope.slice(4);rows=rows.filter(function(x){return x.c.domain===d});label='Domain: '+d}
  else if(scope.indexOf('au:')===0){
    var au=S.data.audits.filter(function(a){return a.id===scope.slice(3)})[0],ids=au?splitRefs(au.items):[];
    rows=rows.filter(function(x){return evFor(x.c).some(function(e){return ids.indexOf(String(e.id).toUpperCase())>=0})});
    audits=au?[au]:[];label='Audit record: '+(au?au.id+(au.audit?' '+au.audit:''):scope);
  }
  var idSet={},csvRows=[],n,blocks=[],only=null;
  if(scope.indexOf('au:')===0){var au2=S.data.audits.filter(function(a){return a.id===scope.slice(3)})[0];only=au2?splitRefs(au2.items):[]}
  rows.forEach(function(x){
    var its=evFor(x.c).filter(function(e){return !only||only.indexOf(String(e.id).toUpperCase())>=0}),sp=specOf(x.c),st=x.a.status;
    its.forEach(function(e){idSet[e.id]=1;csvRows.push({code:x.c.lib||x.c.id,control:x.c.name,status:st,id:e.id,kind:e.kind||'',item:e.title||'',location:e.link||'',fp:e.fingerprint||'',collected:e.collected||'',valid:e.validUntil||'',istatus:evItemStatus(e)})});
    if(!its.length)csvRows.push({code:x.c.lib||x.c.id,control:x.c.name,status:st,id:'',kind:'',item:'',location:'',fp:'',collected:'',valid:'',istatus:''});
    blocks.push(h('div',{class:'pc'},
      h('div',{class:'pch'},h('b',{text:(x.c.lib||x.c.id)+'  '+x.c.name}),' ',rRag(st,evStatCls(st)==='good'?'good':evStatCls(st)==='crit'?'crit':evStatCls(st)==='warn'?'warn':'mute')),
      sp?h('div',{class:'pcs',text:'Required: design: '+sp.d+'. Operating: '+sp.o+'. Refresh: '+sp.r+'.'}):h('div',{class:'pcs',text:'Required: '+(x.c.expected||'not specified')+'.'}),
      st==='Not applicable'?h('div',{class:'pcs',text:'Not applicable. Reason: '+(x.c.naReason||'not recorded')+'. Approved by: '+(x.c.naBy||'not recorded')+'.'}):null,
      st==='Not applicable'?null:rTable(['ID','Kind','Item','Location','Fingerprint (SHA-256)','Collected','Valid until'],its.map(function(e){return [e.id,e.kind||'–',e.title||'–',e.link||'–',e.fingerprint||'–',e.collected?fmt(e.collected):'–',e.validUntil?fmt(e.validUntil):'No expiry']}),{mono:[4],empty:'No evidence recorded.'})));
  });
  var nItems=Object.keys(idSet).length,comp=rows.filter(function(x){return x.a.status==='Complete'}).length,app=rows.filter(function(x){return x.a.status!=='Not applicable'}).length;
  var sentence='Scope: '+label+'. '+pl(rows.length,'control')+' in scope, of which '+comp+' of '+app+' applicable '+(app===1?'has':'have')+' complete, current evidence. '+pl(nItems,'evidence item')+' listed.';
  n=h('div',null,rHead('AI governance: auditor evidence pack','Evidence index for reviewers'),h('div',{class:'rc'},h('b',{text:'Conclusion. '}),sentence),
    rSec(1,'Evidence by control'),blocks.length?blocks:h('p',{class:'none',text:'No controls in scope.'}),
    rSec(2,'Audit-use log'),rTable(['ID','Audit or review','Auditor','Date','Evidence shared','Shared with and how'],audits.map(function(a){return [a.id,a.audit||'–',a.auditor||'–',a.date?fmt(a.date):'–',a.items||'–',a.shared||'–']}),{empty:'No audit visits recorded.'}),
    h('div',{class:'rb'},h('b',{text:'Note for reviewers. '}),'Files are held in the evidence library at the location shown. To confirm a file is unchanged, work out its SHA-256 fingerprint and compare it with the fingerprint listed here, or use "Check a file" on the Evidence page.'),rBasis());
  return rFinish(n,{rows:csvRows,cols:[['code','Control code'],['control','Control'],['status','Evidence status'],['id','Evidence ID'],['kind','Kind'],['item','Item'],['location','Location'],['fp','Fingerprint (SHA-256)'],['collected','Collected'],['valid','Valid until'],['istatus','Item status']]},Object.keys(idSet));
}
var rptKey='board',rptScope='';
PAGES.reports=function(root){
  var REP={board:['Board summary',repBoard],md:['MD gap report',repMD],register:['Control status register',repRegister],pack:['Auditor evidence pack',repPack]};
  var sel=h('select',{'aria-label':'Report'}),scope=h('select',{'aria-label':'Scope of the evidence pack'}),sheet=h('div',{class:'rpt'}),cur=null;
  Object.keys(REP).forEach(function(k){sel.append(h('option',{value:k,text:REP[k][0]}))});sel.value=rptKey;
  function fillScope(){
    scope.replaceChildren(h('option',{value:'',text:'Scope: all controls'}));
    S.cfg.lists.domains.forEach(function(d){scope.append(h('option',{value:'dom:'+d,text:'Domain: '+d}))});
    S.data.audits.filter(function(a){return a.id&&a.items}).forEach(function(a){scope.append(h('option',{value:'au:'+a.id,text:'Audit record: '+a.id+(a.audit?' '+a.audit:'')}))});
    if(!Array.prototype.some.call(scope.options,function(o){return o.value===rptScope}))rptScope='';
    scope.value=rptScope;scope.style.display=rptKey==='pack'?'':'none';
  }
  function draw(){
    cur=rptKey==='pack'?repPack(rptScope):REP[rptKey][1]();
    sheet.replaceChildren(cur.node);
    csvB.disabled=!cur.csv;logB.style.display=rptKey==='pack'?'':'none';
  }
  var csvB=h('button',{class:'btn',text:'Export CSV',onclick:function(){
    var c=cur.csv;if(!c)return;
    showText('Export '+REP[rptKey][0],toCSV(c.rows,c.cols.map(function(x){return {k:x[0],label:x[1]}})),'Copy this text into a new file and save it as .csv, or paste it straight into Excel.');
  }});
  var logB=h('button',{class:'btn',text:'Add to audit-use log',onclick:function(){
    if(!cur.ids.length){info('Nothing to log','This pack lists no evidence items.');return}
    var r=newRow('audits');r.items=cur.ids.join('; ');r.notes='Created from the auditor evidence pack ('+(scope.options[scope.selectedIndex]||{}).text+'). Add the audit name and auditor on the Evidence page.';
    S.data.audits.push(r);logChange('audits',r.id,'Row','','Added from evidence pack');save();fillScope();
    info('Added to the audit-use log',r.id+' was added with '+pl(cur.ids.length,'evidence item')+'. Complete the audit name, auditor and how it was shared on the Evidence page.');
  }});
  var prt=h('button',{class:'btn pri',text:'Print or save as PDF',onclick:function(){try{window.print()}catch(e){info('Print','Printing is not available here. Open the dashboard in a normal browser tab and try again.')}}});
  sel.addEventListener('change',function(){rptKey=sel.value;fillScope();draw()});
  scope.addEventListener('change',function(){rptScope=scope.value;draw()});
  fillScope();
  root.append(h('div',{class:'card noprint'},h('h2',{text:'Reports'}),
    h('p',{class:'lead',text:'Each report is built from the data in this dashboard at the as-at date. Print it, or choose "Save as PDF" in the print dialog. A report fingerprint at the foot identifies the data state it came from.'}),
    h('div',{class:'tbar'},sel,scope,prt,csvB,logB)),sheet);
  draw();
};

/* ---------- shell ---------- */
function applyTheme(){
  var a=/^#[0-9a-f]{6}$/i.test(S.cfg.accent)?S.cfg.accent:'#0B4F6C';
  document.documentElement.style.setProperty('--accent',a);
  var n=parseInt(a.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255,lum=(0.299*r+0.587*g+0.114*b)/255;
  document.documentElement.style.setProperty('--accent-ink',lum>0.6?'#13202B':'#FFFFFF');
}
function visiblePages(){return S.cfg.pages.filter(function(p){return p.on||p.id==='setup'})}
var curPage='';
function goPage(id){
  curPage=id;
  try{if(location.hash!=='#'+id)history.replaceState(null,'','#'+id)}catch(e){try{location.hash=id}catch(e2){}}
  render();window.scrollTo(0,0);
}
function currentId(){
  var id=curPage||(location.hash||'').slice(1),v=visiblePages();
  return v.some(function(p){return p.id===id})?id:v[0].id;
}
function drawRail(){
  var cur=currentId();
  $('#railTitle').textContent=S.cfg.title||'AI Governance Dashboard';
  $('#nav').replaceChildren.apply($('#nav'),visiblePages().map(function(p){
    var a=h('a',{href:'#'+p.id,text:p.label});
    a.addEventListener('click',function(ev){ev.preventDefault();goPage(p.id)});
    if(p.id===cur)a.setAttribute('aria-current','page');return a;
  }));
}
function drawTop(){
  var cur=currentId(),p=S.cfg.pages.filter(function(x){return x.id===cur})[0];
  $('#top').replaceChildren(
    h('div',null,h('div',{class:'eyebrow',text:S.cfg.org}),h('h1',{text:p?p.label:''})),
    h('div',{class:'asat',text:'As at '+fmt(S.cfg.asAt)}));
}
function drawNotices(){
  var n=$('#notices'),k=[];
  if(S.cfg.sample)k.push(h('div',{class:'banner'},h('span',null,h('b',{text:'Sample data. '}),'Every entry is invented for illustration. Clear it to start with your own, or edit it in place.'),
    confirmBtn('Clear sample data',function(){S.data=emptyData();S.cfg.sample=false;save();render()},'btn pri')));
  if(!storageOK)k.push(h('div',{class:'banner'},h('span',{text:'This browser is not saving your changes. Use Settings, then Export all, to keep a copy.'})));
  n.replaceChildren.apply(n,k);
}
function render(){
  applyTheme();drawNotices();drawRail();drawTop();
  var id=currentId(),root=$('#page');root.replaceChildren();
  document.title=(S.cfg.title||'AI Governance Dashboard');
  document.body.classList.toggle('rptmode',id==='reports');
  try{PAGES[id](root)}catch(e){root.append(h('div',{class:'card'},h('h2',{text:'This page could not be drawn'}),h('p',{text:String(e&&e.message||e)})))}
}
window.addEventListener('hashchange',function(){curPage=(location.hash||'').slice(1);render();window.scrollTo(0,0)});
render();
})();
</script>
